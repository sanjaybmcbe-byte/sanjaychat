<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Wide Chat UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
    }

    /* APP LAYOUT */
    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      width: 100%;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      background: #020617;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 18px;
      font-size: 18px;
      font-weight: 600;
      border-bottom: 1px solid #1e293b;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
    }

    .chat-item:hover { background: #020617; }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #020617;
    }

    .chat-info h4 {
      font-size: 14px;
      font-weight: 500;
    }

    .chat-info p {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT PANEL */
    .chat-panel {
      display: flex;
      flex-direction: column;
      background: #020617;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header h3 { font-size: 15px; }
    .chat-header span { font-size: 12px; color: #22c55e; }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
    }

    .left {
      background: #1e293b;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .right {
      background: #38bdf8;
      color: #020617;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* INPUT */
    .chat-input {
      padding: 14px 18px;
      border-top: 1px solid #1e293b;
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 14px;
      color: #e5e7eb;
      outline: none;
    }

    .chat-input button {
      background: #38bdf8;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 600;
      cursor: pointer;
      color: #020617;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">Chats</div>
    <div class="chat-list">
      <div class="chat-item">
        <div class="avatar">A</div>
        <div class="chat-info">
          <h4>Alex</h4>
          <p>Are we still meeting later?</p>
        </div>
      </div>
      <div class="chat-item">
        <div class="avatar">S</div>
        <div class="chat-info">
          <h4>Sarah</h4>
          <p>Just pushed the latest update 🚀</p>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAT PANEL -->
  <div class="chat-panel">
    <div class="chat-header">
      <div class="avatar">A</div>
      <div>
        <h3>Alex</h3>
        <span>Online</span>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="bubble left">Hey! 😊</div>
      <div class="bubble right">Hey Alex! Yeah, what's up?</div>
      <div class="bubble left">Are we still meeting later today?</div>
    </div>

    <div class="chat-input">
      <input id="input" placeholder="Type a message..." />
      <button onclick="send()">Send</button>
    </div>
  </div>

</div>

<script>
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');

  function send() {
    if (input.value.trim() === '') return;

    const msg = document.createElement('div');
    msg.className = 'bubble right';
    msg.textContent = input.value;
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
    input.value = '';

    setTimeout(() => {
      const reply = document.createElement('div');
      reply.className = 'bubble left';
      reply.textContent = 'Sounds good 👍';
      messages.appendChild(reply);
      messages.scrollTop = messages.scrollHeight;
    }, 700);
  }
</script>

</body>
</html>
