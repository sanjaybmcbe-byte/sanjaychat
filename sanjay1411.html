<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wide Instagram Chat UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
    }

    /* LAYOUT */
    .app {
      display: grid;
      grid-template-columns: 340px 1fr;
      width: 100%;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      border-right: 1px solid #262626;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 18px;
      font-weight: 600;
      font-size: 18px;
      border-bottom: 1px solid #262626;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
    }

    .chat-item:hover { background: #121212; }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);
      padding: 2px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #000;
    }

    .chat-info {
      flex: 1;
    }

    .chat-info h4 {
      font-size: 14px;
      font-weight: 500;
    }

    .chat-info p {
      font-size: 12px;
      color: #a1a1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT PANEL */
    .chat-panel {
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid #262626;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header h3 { font-size: 15px; }
    .chat-header span { font-size: 12px; color: #22c55e; }

    .messages {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .bubble {
      max-width: 60%;
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 18px;
      line-height: 1.4;
    }

    .left {
      align-self: flex-start;
      background: #262626;
      border-bottom-left-radius: 4px;
    }

    .right {
      align-self: flex-end;
      background: linear-gradient(45deg,#f58529,#dd2a7b,#8134af);
      border-bottom-right-radius: 4px;
    }

    /* INPUT */
    .chat-input {
      border-top: 1px solid #262626;
      padding: 14px 18px;
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      background: #262626;
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      color: #fff;
      outline: none;
    }

    .chat-input button {
      background: none;
      border: none;
      color: #0095f6;
      font-weight: 600;
      cursor: pointer;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">Messages</div>
    <div class="chat-list">
      <div class="chat-item">
        <div class="avatar"><img src="https://i.pravatar.cc/100?img=12"></div>
        <div class="chat-info">
          <h4>alex_johnson</h4>
          <p>Hey! Are you free to chat for a bit?</p>
        </div>
      </div>
      <div class="chat-item">
        <div class="avatar"><img src="https://i.pravatar.cc/100?img=32"></div>
        <div class="chat-info">
          <h4>sarah_dev</h4>
          <p>Should we deploy the update tonight? 🚀</p>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat-panel">
    <div class="chat-header">
      <div class="avatar"><img src="https://i.pravatar.cc/100?img=12"></div>
      <div>
        <h3>alex_johnson</h3>
        <span>Active now</span>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="bubble left">Hey! 👋</div>
      <div class="bubble right">Wow this feels just like Instagram on desktop 😄</div>
      <div class="bubble left">Yeah! The wide layout makes chatting so much easier.</div>
    </div>

    <div class="chat-input">
      <input id="input" placeholder="Message..." />
      <button onclick="send()">Send</button>
    </div>
  </div>
</div>

<script>
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');

  function send() {
    if (input.value.trim() === '') return;

    const msg = document.createElement('div');
    msg.className = 'bubble right';
    msg.textContent = input.value;
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
    input.value = '';

    setTimeout(() => {
      const reply = document.createElement('div');
      reply.className = 'bubble left';
      reply.textContent = 'Seen 👀';
      messages.appendChild(reply);
      messages.scrollTop = messages.scrollHeight;
    }, 700);
  }
</script>

</body>
</html>
